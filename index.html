<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ErrorKillerMole69 / Portfolio</title>
     
    <style>
        :root {
            /* Rozjaśnione tło, aby strona nie była zbyt ciemna */
            --bg-gradient-start: #420620; /* Jaśniejsze bordo */
            --bg-gradient-end: #1f0430;   /* Jaśniejszy fiolet */
            --neon-blue: #00f0ff;         /* Jasnoniebieskie światło */
            --neon-green: #39ff14;        /* Jasnozielone światło */
            --text-color: #f1f5f9;        /* Bardzo jasny tekst */
            --btn-bg: #052e16;            /* Ciemnozielony przycisk */
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px 20px 80px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            border: 4px solid var(--neon-blue);
            box-sizing: border-box;
            box-shadow: inset 0 0 40px rgba(0, 240, 255, 0.5);
            position: relative;
            overflow-x: hidden;
        }

        /* --- DRZEWA NEONOWE (MAKSYMALNIE ROZJAŚNIONE) --- */
        .neon-tree {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-green);
            opacity: 1 !important; /* Pełna widoczność */
            text-shadow: 0 0 12px var(--neon-green), 0 0 25px var(--neon-green), 0 0 35px var(--neon-green);
            white-space: pre;
            z-index: 1;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .tree-left { left: 2%; text-align: left; }
        .tree-right { right: 2%; text-align: right; }

        /* --- NIEDŹWIEDŹ WYCHYLAJĄCY SIĘ ZZA PRAWEGO DRZEWA --- */
        .cyber-bear {
            position: fixed;
            top: 55%;
            right: -120px; /* Schowany całkowicie za prawą krawędzią/drzewem */
            color: #ffaa00;
            font-family: monospace;
            white-space: pre;
            font-size: 0.95rem;
            text-shadow: 0 0 12px #ffaa00, 0 0 25px #ffaa00;
            z-index: 2;
            transition: right 0.5s ease-in-out;
            pointer-events: none;
        }

        /* Klasa aktywowana przez JavaScript co minutę po zderzeniu kaczki */
        .bear-peek {
            right: 3%; /* Wychyla się zza prawego drzewa */
        }

        /* --- CYFROWA KACZKA --- */
        .cyber-duck {
            position: fixed;
            top: 45%;
            right: -150px;
            color: #00f0ff;
            font-family: monospace;
            white-space: pre;
            font-size: 0.95rem;
            text-shadow: 0 0 12px var(--neon-blue), 0 0 25px var(--neon-blue);
            z-index: 10;
            pointer-events: none;
            display: none; 
        }

        .duck-flying {
            display: block;
            animation: duck-flight-path 4s linear forwards;
        }

        @keyframes duck-flight-path {
            0% {
                right: -150px;
                transform: translateY(0) scaleX(1);
            }
            75% {
                /* Dolatuje do lewego drzewa */
                right: 88%;
                transform: translateY(-20px) scaleX(1);
            }
            80% {
                /* BUM! Uderzenie o lewe drzewo i zmiana koloru */
                right: 88%;
                transform: translateY(-20px) rotate(-45deg);
                color: #ff0055; 
                text-shadow: 0 0 20px #ff0055;
            }
            100% {
                /* Spadek do wody */
                right: 88%;
                top: 85%;
                transform: translateY(100px) rotate(-90deg);
                opacity: 0;
                color: #ff0055;
            }
        }

        /* --- CYBER WODA --- */
        .cyber-water {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: linear-gradient(transparent, rgba(0, 240, 255, 0.3));
            border-top: 2px dashed var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
            z-index: 3;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .water-waves {
            color: var(--neon-blue);
            font-size: 1.3rem;
            letter-spacing: 8px;
            text-shadow: 0 0 10px var(--neon-blue);
            white-space: nowrap;
            animation: wave-move 4s linear infinite;
        }

        @keyframes wave-move {
            0% { transform: translateX(0); }
            100% { transform: translateX(-40px); }
        }

        /* --- NAGŁÓWEK (REPARACJA ROZJECHANIA) --- */
        .header {
            text-align: center;
            margin-top: 40px;
            position: relative;
            z-index: 5;
            max-width: 65%; /* Zapobiega nachodzeniu na drzewa */
            width: 100%;
        }

        h1 {
            color: #fff;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px var(--neon-blue), 0 0 40px var(--neon-blue);
            margin-bottom: 15px;
            line-height: 1.4;
            display: block;
            width: 100%;
        }

        .subtitle {
            color: var(--neon-green);
            font-size: 1.15rem;
            text-shadow: 0 0 10px var(--neon-green);
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        /* --- KONTENER SKILLI I FORMULARZA --- */
        .container {
            max-width: 700px;
            width: 100%;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            position: relative;
            z-index: 5;
        }

        .terminal-box {
            background: rgba(0, 0, 0, 0.9); /* Bardziej wyraziste tło dla czytelności */
            border: 2px solid var(--neon-blue); 
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5); 
            padding: 25px;
            border-radius: 5px;
            line-height: 1.8;
            font-size: 0.95rem;
        }

        .section-title {
            color: var(--neon-green);
            text-shadow: 0 0 8px var(--neon-green);
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .skill-line {
            margin-bottom: 8px;
            white-space: pre-wrap;
        }

        /* --- STYLIZACJA POLI FORMULARZA --- */
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            color: var(--neon-blue);
            text-shadow: 0 0 5px var(--neon-blue);
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .cyber-input, .cyber-textarea {
            width: 100%;
            background: rgba(0, 15, 5, 0.8);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            box-sizing: border-box;
            outline: none;
            box-shadow: inset 0 0 5px rgba(57, 255, 20, 0.2);
        }

        .cyber-input:focus, .cyber-textarea:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4), inset 0 0 5px rgba(0, 240, 255, 0.2);
            color: var(--neon-blue);
        }

        .cyber-textarea {
            height: 120px;
            resize: none;
        }

        .punk-btn {
            background-color: var(--btn-bg);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 12px 24px;
            margin-top: 10px;
            border: 2px solid var(--neon-green);
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
            text-shadow: 0 0 5px var(--neon-green);
            transition: all 0.3s ease;
            width: 100%;
        }

        .punk-btn:hover {
            background-color: var(--neon-green);
            color: #000;
            box-shadow: 0 0 20px var(--neon-green);
            text-shadow: none;
            transform: scale(1.01);
        }

        .contact-notice {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #a7f3d0;
            border-left: 3px solid var(--neon-blue);
            padding-left: 10px;
            line-height: 1.4;
        }
    </style>
</head>
