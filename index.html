    <style>
        :root {
            --bg-gradient-start: #2b0414; /* Ciemne bordo */
            --bg-gradient-end: #12021c;   /* Głęboki fiolet */
            --neon-blue: #00f0ff;         /* Jasnoniebieskie światło */
            --neon-green: #39ff14;        /* Jasnozielone światło */
            --text-color: #e2e8f0;
            --btn-bg: #052e16;            /* Ciemnozielony przycisk */
        }
           
            body {
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px 20px 120px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            border: 4px solid var(--neon-blue);
            box-sizing: border-box;
            box-shadow: inset 0 0 30px rgba(0, 240, 255, 0.3);
            position: relative;
            overflow-x: hidden;
        }
         
        .neon-tree {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-green);
            font-size: 1.8rem;
            line-height: 1.1;
            white-space: pre;
            text-shadow: 0 0 15px var(--neon-green), 0 0 30px var(--neon-green);
            user-select: none;
            pointer-events: none;
            opacity: 0.4;
            z-index: 1;
        }

        .tree-left { left: 4%; text-align: left; }
        .tree-right { right: 4%; text-align: right; }

        .cyber-water {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: linear-gradient(transparent, rgba(0, 240, 255, 0.15));
            border-top: 2px dashed var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            z-index: 10;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .water-waves {
            color: var(--neon-blue);
            font-size: 1.2rem;
            letter-spacing: 8px;
            text-shadow: 0 0 8px var(--neon-blue);
            white-space: nowrap;
            animation: wave-move 4s linear infinite;
        }

        @keyframes wave-move {
            0% { transform: translateX(0); }
            100% { transform: translateX(-40px); }
        }

        /* ANIMACJA CYFROWEJ KACZKI: LOT, UDERZENIE, UPADEK */
        .cyber-duck {
            position: fixed;
            z-index: 9;
            pointer-events: none;
            width: 50px;
            height: 45px;
            animation: duck-lifecycle 7s linear infinite;
        }

        .duck-body {
            position: absolute;
            width: 35px;
            height: 22px;
            background: #facc15;
            border-radius: 15px 15px 10px 10px;
            bottom: 0;
            box-shadow: 0 0 8px #facc15;
        }

        .duck-head {
            position: absolute;
            width: 18px;
            height: 18px;
            background: #facc15;
            border-radius: 50%;
            top: -10px;
            left: -5px; /* Głową skierowana w lewo pod kątem lotu */
        }

        .duck-beak {
            position: absolute;
            width: 8px;
            height: 6px;
            background: #f97316;
            border-radius: 5px 0 0 5px;
            top: 4px;
            left: -6px;
        }

        .duck-wing {
            position: absolute;
            width: 15px;
            height: 10px;
            background: #eab308;
            border-radius: 50%;
            top: 4px;
            left: 12px;
            transform-origin: top center;
            animation: duck-wing-flap 0.2s linear infinite alternate;
        }

        @keyframes duck-lifecycle {
            /* Start: schowana za prawym drzewem (90% szerokości ekranu) */
            0% {
                top: 40%;
                left: 90%;
                transform: rotate(0deg) scaleX(1);
            }
            /* Lot w lewo i uderzenie w lewe drzewo (5% szerokości ekranu) */
            60% {
                top: 30%;
                left: 5%;
                transform: rotate(0deg) scaleX(1);
            }
            /* Moment zderzenia: obrót do góry nogami i bezwładność */
            65% {
                top: 32%;
                left: 5%;
                transform: rotate(140deg) scaleX(1);
            }
            /* Pionowy spadek na dół do wody */
            90% {
                top: calc(100vh - 50px);
                left: 5%;
                transform: rotate(180deg) scaleX(1);
                opacity: 1;
            }
            /* Zanurzenie w wodzie i zniknięcie */
            95% {
                top: calc(100vh - 20px);
                left: 5%;
                transform: rotate(180deg) scaleX(1);
                opacity: 0;
            }
            100% {
                top: 40%;
                left: 90%;
                transform: rotate(0deg) scaleX(1);
                opacity: 0;
            }
        }

        @keyframes duck-wing-flap {
            0% { transform: rotate(-30deg); }
            100% { transform: rotate(50deg); }
        }

        .header {
            text-align: center;

        h1 {

            margin-top: 0;

        .punk-btn {
            background-color: var(--btn-bg);
            color: var(--neon-green);

            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 10px 20px;
            margin-top: 15px;
            border: 2px solid var(--neon-green);
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
            text-shadow: 0 0 5px var(--neon-green);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;

        .punk-btn:hover {

        .status-output {
