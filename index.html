    <style>
        :root {
            --bg-gradient-start: #2b0414; /* Ciemne bordo */
            --bg-gradient-end: #12021c;   /* Głęboki fiolet */
            --neon-blue: #00f0ff;         /* Jasnoniebieskie światło */
            --neon-green: #39ff14;        /* Jasnozielone światło */
            --text-color: #e2e8f0;        /* Neutralny */
            --btn-bg: #052e16;            /* Ciemnozielony przycisk */
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px 20px 80px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            border: 4px solid var(--neon-blue);
            box-sizing: border-box;
            box-shadow: inset 0 0 30px rgba(0, 240, 255, 0.3);
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* --- DRZEWA NEONOWE (POPRAWIONE) --- */
        .neon-tree {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-green);
            opacity: 0.9 !important; /* Maksymalna widoczność */
            text-shadow: 0 0 10px var(--neon-green), 0 0 20px rgba(57, 255, 20, 0.5);
            white-space: pre;
            z-index: 1;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .tree-left { left: 2%; text-align: left; }
        .tree-right { right: 2%; text-align: right; }

        /* --- NIEDŹWIEDŹ --- */
        .cyber-bear {
            position: fixed;
            top: 55%;
            left: -100px;
            color: #ffaa00;
            font-family: monospace;
            white-space: pre;
            font-size: 0.9rem;
            text-shadow: 0 0 8px #ffaa00;
            z-index: 2;
            transition: left 0.5s ease-in-out;
            pointer-events: none;
        }

        .bear-peek {
            left: 3%;
        }

        /* --- KACZKA --- */
        .cyber-duck {
            position: fixed;
            top: 45%;
            right: -150px;
            color: #00f0ff;
            font-family: monospace;
            white-space: pre;
            font-size: 0.9rem;
            text-shadow: 0 0 10px var(--neon-blue);
            z-index: 10;
            pointer-events: none;
            display: none;
        }

        .duck-flying {
            display: block;
            animation: duck-flight-path 4s linear forwards;
        }

        @keyframes duck-flight-path {
            0% { right: -150px; transform: translateY(0) scaleX(1); }
            75% { right: 88%; transform: translateY(-20px) scaleX(1); }
            80% { right: 88%; transform: translateY(-20px) rotate(-45deg); color: #ff0055; text-shadow: 0 0 15px #ff0055; }
            100% { right: 88%; top: 85%; transform: translateY(100px) rotate(-90deg); opacity: 0; color: #ff0055; }
        }

        /* --- WODA --- */
        .cyber-water {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: linear-gradient(transparent, rgba(0, 240, 255, 0.2));
            border-top: 2px dashed var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            z-index: 3;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .water-waves {
            color: var(--neon-blue);
            font-size: 1.2rem;
            letter-spacing: 8px;
            text-shadow: 0 0 8px var(--neon-blue);
            white-space: nowrap;
            animation: wave-move 4s linear infinite;
        }

        @keyframes wave-move {
            0% { transform: translateX(0); }
            100% { transform: translateX(-40px); }
        }

        /* --- NAGŁÓWEK (POPRAWIONY) --- */
        .header {
            text-align: center;
            margin-top: 40px;
            position: relative;
            z-index: 5;
            max-width: 90%;
            width: 100%;
        }

        h1 {
            color: #fff;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 15px var(--neon-blue), 0 0 30px var(--neon-blue);
            margin-bottom: 10px;
            word-wrap: break-word;
        }

        .subtitle {
            color: var(--neon-green);
            font-size: 1.1rem;
            text-shadow: 0 0 8px var(--neon-green);
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        /* --- SKILLE (KARTOTEKA Z TWOJEGO SCREENA) --- */
        .container {
            max-width: 800px;
            width: 100%;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            position: relative;
            z-index: 5;
        }

        .terminal-box {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            padding: 25px;
            border-radius: 5px;
            line-height: 1.8;
            font-size: 0.95rem;
            white-space: pre-wrap; /* Zachowuje entery i formatowanie kodu */
        }

        .section-title {
            color: var(--neon-green);
            text-shadow: 0 0 5px var(--neon-green);
            margin-top: 0;
            font-size: 1.3rem;
        }

        .skill-line {
            margin-bottom: 8px;
            white-space: pre-wrap;
        }

        .punk-btn {
            background-color: var(--btn-bg);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 10px 20px;
            margin-top: 15px;
            border: 2px solid var(--neon-green);
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
            text-shadow: 0 0 5px var(--neon-green);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .punk-btn:hover {
            background-color: var(--neon-green);
            color: #000;
            box-shadow: 0 0 20px var(--neon-green);
            text-shadow: none;
            transform: scale(1.02);
        }

        .status-output {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 20, 0, 0.4);
            border-left: 3px solid var(--neon-green);
            font-size: 0.9rem;
            color: #a7f3d0;
            display: none;
        }

        .cyber-textarea {
            width: 100%;
            height: 150px;
            background: rgba(0, 10, 5, 0.8);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
        }
